<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Crear cuenta')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="auth-wrap">
    <div class="auth-card">
        <h2>Crea tu cuenta</h2>
        <p class="text-muted">Con tu cuenta puedes enviar pedidos y ver su estado.</p>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/procesarRegistro}" method="post">
            <div class="mb-3">
                <label class="form-label" for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="form-control" th:value="${nombre}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" th:value="${email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" class="form-control" th:value="${telefono}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmarPassword">Repite la contraseña</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
        </form>
        <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a th:href="@{/login}">Ingresar</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
</body>
</html>
