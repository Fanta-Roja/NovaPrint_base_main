<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/header :: head('Ingresar')}"></head>
<body class="pagina-interna">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="auth-wrap">
    <div class="auth-card">
        <h2>Bienvenido de vuelta</h2>
        <p class="text-muted">Ingresa para hacer y seguir tus pedidos.</p>
        <div th:if="${param.registroExitoso}" class="alert alert-success">Cuenta creada. Ya puedes ingresar.</div>
        <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos.</div>
        <form th:action="@{/procesarLogin}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="tu@correo.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scroll.js}"></script>
</body>
</html>
