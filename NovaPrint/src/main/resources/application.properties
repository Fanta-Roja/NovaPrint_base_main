spring.application.name=novaprint
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Base de datos (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_novaprint?createDatabaseIfNotExist=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
